name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:package

  package-npm-12:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@12.0.2
      - run: npm ci
      - run: npm run test:package

  upstream-compatibility:
    name: Supported Claude/Codex compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLAUDE_WORKFLOW_REQUIRE_INSTALLED_CLIS: '1'
      CLAUDE_WORKFLOW_EXPECT_CLAUDE_VERSION: '2.1.261'
      CLAUDE_WORKFLOW_EXPECT_CODEX_VERSION: '0.153.4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install supported upstream CLIs
        run: >-
          npm install --global --no-audit --no-fund
          @anthropic-ai/claude-code@2.1.261
          @openai/codex@0.153.4
      - run: npm run -s test:upstream-compatibility
